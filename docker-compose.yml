version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: manosya_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manosya
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manosya"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para rate limiting en desarrollo (opcional, puede usar Upstash en dev también)
  redis:
    image: redis:7-alpine
    container_name: manosya_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
